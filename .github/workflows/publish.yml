# Publishes each full release of this repo to PyPI and npm: the same binaries,
# as wheels and as npm packages. Both registries trust this workflow, so it
# holds no tokens. Each stays off until its repo variable (PYPI, NPM) is true.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: A released version, like 0.1.0
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          gh release download "v$VERSION" --pattern 'invideo-*' --dir dist
          cd dist && for sum in *.sha256; do sha256sum -c "$sum"; done && rm *.sha256

      - name: Package
        run: |
          python3 packaging/wheels.py "$VERSION" dist wheels
          python3 packaging/npm.py "$VERSION" dist npm

      - name: Publish to PyPI
        if: vars.PYPI == 'true'
        run: pipx run uv publish --trusted-publishing always wheels/*

      - uses: actions/setup-node@v4
        if: vars.NPM == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The platform packages first, so the ones people install never point at
      # a missing one. NPM_TOKEN is only for a package's first publish, before
      # npm can trust this workflow for it.
      - name: Publish to npm
        if: vars.NPM == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g npm@latest
          for package in npm/@invideo-ai__cli-* npm/@invideo-ai__cli npm/invideo; do
            npm publish "$package" --access public
          done
